name: Zelto Core Tests
on:
  push:
    branches: [main]
    paths: ["Package.swift", "Sources/**", "Tests/**", ".github/workflows/core-tests.yml"]
  pull_request:
    paths: ["Package.swift", "Sources/**", "Tests/**", ".github/workflows/core-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zelto-core-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift test
