name: Zelto
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZeltoCore:
    path: ..
targets:
  Zelto:
    type: application
    platform: iOS
    sources:
      - path: ZeltoApp
    dependencies:
      - package: ZeltoCore
        product: ZeltoCore
      - target: ZeltoLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmiidev.zelto
        PRODUCT_NAME: Zelto
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zelto
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
  ZeltoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ZeltoLiveActivity
    dependencies:
      - package: ZeltoCore
        product: ZeltoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmiidev.zelto.ZeltoLiveActivity
        PRODUCT_NAME: ZeltoLiveActivity
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
